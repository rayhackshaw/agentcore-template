[project]
name = "agentcore-template"
version = "0.1.0"
description = "Reusable Bedrock AgentCore + Strands orchestrator scaffold: streaming sub-agents, interrupts, plan approval, prompt caching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=0.1.5",
    "strands-agents>=1.10.0",
    "strands-agents-tools>=0.2.9",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
agentcore-local = "agent_core.run:run_local_server"
agentcore-invoke = "agent_core.local_invoke:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "ruff>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "W", "F", "I", "N", "B", "C4", "UP"]
ignore = ["E501"]
